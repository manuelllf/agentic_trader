version: 2
updates:
  # Backend: declarado en pyproject.toml, bloqueado en uv.lock.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "20260927_liguilla"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    target-branch: "20260927_liguilla"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "20260927_liguilla"
