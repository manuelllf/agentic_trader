<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Alpha mira datos y decide; una propuesta pasa por los límites en código y por un revisor, y si pasa se ejecuta en la apertura siguiente">
<title>Cómo decide Alpha cada día</title><style>
:root{--bg:#F2F2F7;--su:#FFFFFF;--su2:#E9E9EF;--ln:#D8D8DC;--ink:#000;--ink2:#3C3C43;--mu:#6E6E73;--ac:#0B6E68;--acbg:rgba(11,110,104,.14);--bi:#FFF}
@media (prefers-color-scheme: dark){:root{--bg:#000;--su:#1C1C1E;--su2:#2C2C2E;--ln:#38383A;--ink:#FFF;--ink2:#C7C7CC;--mu:#8E8E93;--ac:#4FA39D;--acbg:rgba(79,163,157,.2);--bi:#000}}
text{font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.bg{fill:var(--bg)}.su{fill:var(--su)}.su2{fill:var(--su2)}.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.mu{fill:var(--mu)}.ac{fill:var(--ac)}.acbg{fill:var(--acbg)}.bi{fill:var(--bi)}
.h1{font-size:46px;font-weight:700;letter-spacing:-.6px}.sub{font-size:26px}.t{font-size:30px;font-weight:700}.tag{font-size:22px;font-weight:600}.d{font-size:22px}.pie{font-size:22px}
.n{font-size:26px;font-weight:700}.l{font-size:22px;font-weight:600}
.tok{transform:translate(174px,350px)}
.mov{animation:viaje 10s infinite}
@keyframes viaje{0%{transform:translate(174px,350px);opacity:0}4%{opacity:1}24%{transform:translate(474px,350px)}33%{transform:translate(474px,350px)}54%{transform:translate(744px,350px)}63%{transform:translate(744px,350px)}86%{transform:translate(1014px,350px);opacity:1}95%{transform:translate(1014px,350px);opacity:1}100%{transform:translate(1014px,350px);opacity:0}}
@media (prefers-reduced-motion:reduce){.mov{animation:none}}
.est .mov{animation:none}</style>
<rect class="bg" width="1200" height="675"/>
<text class="h1 ink" x="64" y="92">Cómo decide Alpha cada día</text><text class="sub mu" x="64" y="132">Desde que cierra Nueva York hasta la apertura siguiente</text>
<rect class="su" x="48" y="164" width="1104" height="432" rx="20"/><polyline points="94,280 124,262 150,270 182,236 212,246 246,214 276,226 296,200" style="fill:none;stroke:var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
     <circle cx="296" cy="200" r="8" class="ac"/>
     <rect x="94" y="296" width="200" height="10" rx="5" style="fill:var(--ln)"/><rect x="94" y="314" width="130" height="10" rx="5" style="fill:var(--ln)"/><rect x="354" y="214" width="70" height="64" rx="14" class="acbg"/><text class="n ac" x="389" y="255" text-anchor="middle">5</text><rect x="439" y="214" width="70" height="64" rx="14" class="acbg"/><text class="n ac" x="474" y="255" text-anchor="middle">30 %</text><rect x="524" y="214" width="70" height="64" rx="14" class="acbg"/><text class="n ac" x="559" y="255" text-anchor="middle">7 d</text><rect x="634" y="200" width="84" height="84" rx="20" class="ac"/><path d="M662.5 243.5l9 10.5l18 -22.5" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--bi)"/>
     <rect x="748" y="200" width="84" height="84" rx="20" fill="none" style="stroke:var(--mu)" stroke-width="4"/><path d="M776 228l28 28M804 228l-28 28" style="stroke:var(--mu)" stroke-width="5" stroke-linecap="round"/>
     <text class="d mu" x="676" y="312" text-anchor="middle">aprueba</text><text class="d mu" x="790" y="312" text-anchor="middle">tumba</text><circle cx="1014" cy="244" r="50" fill="none" style="stroke:var(--ink)" stroke-width="5"/><path d="M1014 244l-23 -6M1014 244v34" style="stroke:var(--ink)" stroke-width="5" stroke-linecap="round"/><circle cx="1014" cy="244" r="5" class="ink"/>
     <text class="d mu" x="1014" y="318" text-anchor="middle">9:30, Nueva York</text><line x1="84" y1="350" x2="1134" y2="350" style="stroke:var(--ln)" stroke-width="8" stroke-linecap="round"/>
    <rect x="469" y="326" width="10" height="48" rx="5" class="ac"/><rect x="739" y="326" width="10" height="48" rx="5" class="ac"/>
    <g class="tok mov"><rect x="-68" y="-19" width="136" height="38" rx="19" class="ac"/><text class="l bi" x="0" y="8" text-anchor="middle">propuesta</text></g><text class="t ink" x="84" y="408">Alpha decide</text><text class="t ink" x="354" y="408">Límites</text><text class="t ink" x="624" y="408">Revisor</text><text class="t ink" x="894" y="408">Orden</text><text class="tag ac" x="354" y="436">en código</text><text class="tag ac" x="624" y="436">otro modelo</text><text class="d ink2" x="84" y="466" text-anchor="start"><tspan x="84" dy="0">Precios, cuentas,</tspan><tspan x="84" dy="29">noticias y fichas.</tspan><tspan x="84" dy="29">Compra, vende o nada.</tspan></text><text class="d ink2" x="354" y="466" text-anchor="start"><tspan x="354" dy="0">Máximo 5 posiciones,</tspan><tspan x="354" dy="29">30 % cada una y nada</tspan><tspan x="354" dy="29">la semana antes de</tspan><tspan x="354" dy="29">resultados.</tspan></text><text class="d ink2" x="624" y="466" text-anchor="start"><tspan x="624" dy="0">Sin historial de la</tspan><tspan x="624" dy="29">cartera. Aprueba o</tspan><tspan x="624" dy="29">tumba la operación.</tspan></text><text class="d ink2" x="894" y="466" text-anchor="start"><tspan x="894" dy="0">Se ejecuta en la</tspan><tspan x="894" dy="29">apertura siguiente,</tspan><tspan x="894" dy="29">con comisiones reales.</tspan></text>
