<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Una venta tiene que citar una frase de la ficha tal como estaba al empezar el día; el código lo comprueba, el revisor ve la ficha de antes y la de ahora, y si se rechaza la ficha vuelve a como estaba">
<title>Qué comprueba ahora una venta</title><style>
:root{--bg:#F2F2F7;--su:#FFFFFF;--su2:#E9E9EF;--ln:#D8D8DC;--ink:#000;--ink2:#3C3C43;--mu:#6E6E73;--ac:#0B6E68;--acbg:rgba(11,110,104,.14);--bi:#FFF}
@media (prefers-color-scheme: dark){:root{--bg:#000;--su:#1C1C1E;--su2:#2C2C2E;--ln:#38383A;--ink:#FFF;--ink2:#C7C7CC;--mu:#8E8E93;--ac:#4FA39D;--acbg:rgba(79,163,157,.2);--bi:#000}}
text{font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.bg{fill:var(--bg)}.su{fill:var(--su)}.su2{fill:var(--su2)}.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.mu{fill:var(--mu)}.ac{fill:var(--ac)}.acbg{fill:var(--acbg)}.bi{fill:var(--bi)}
.h1{font-size:46px;font-weight:700;letter-spacing:-.6px}.sub{font-size:26px}.t{font-size:30px;font-weight:700}.tag{font-size:22px;font-weight:600}.d{font-size:22px}.pie{font-size:22px}
.n{font-size:26px;font-weight:700}.l{font-size:22px;font-weight:600}
.flujo{animation:marcha 1.4s linear infinite}.rew{transform-box:fill-box;transform-origin:center;animation:rw 4s ease-in-out infinite}
@keyframes marcha{to{stroke-dashoffset:-22}}@keyframes rw{0%,55%{transform:rotate(0)}100%{transform:rotate(-360deg)}}
@media (prefers-reduced-motion:reduce){.flujo,.rew{animation:none}}
.est .flujo,.est .rew{animation:none}</style>
